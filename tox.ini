[tox]
requires =
    # for uv_resolution in py3-lowest
    tox-uv >= 1.11
envlist = lint,typing,docs,py3,py3-lowest

[testenv]
passenv = BOTO_CONFIG,DATALAD_*
extras = all
commands = pytest -s -v {posargs} heudiconv

# Install the lowest version satisfying our requirements of every direct
# dependency (via "lowest-direct" resolution of uv) on the oldest Python we
# support, to verify that the lower bounds in pyproject.toml are actually valid.
# A direct dependency without a lower bound would resolve to its very first
# release, and most likely break: that is a signal to state a real bound.
[testenv:py3-lowest]
basepython = python3.10
uv_resolution = lowest-direct
passenv = {[testenv]passenv}
extras = {[testenv]extras}
commands = {[testenv]commands}

[testenv:lint]
skip_install = True
deps =
    codespell
    flake8
    flake8-bugbear
    flake8-builtins
    flake8-unused-arguments
commands =
    flake8 heudiconv
    codespell

[testenv:typing]
deps =
    mypy
extras = all
commands =
    mypy heudiconv

[testenv:docs]
# Mirrors what Read the Docs does according to .readthedocs.yaml, so that a
# docs build which would fail there fails here (and in CI) first.
extras = all,docs
commands =
    sphinx-build -W --keep-going -b html {posargs} docs {envtmpdir}/html

[pytest]
#  monitor.py requires optional linotify, but would blow tests discovery, does not contain tests within
addopts = --doctest-modules --tb=short --ignore heudiconv/cli/monitor.py
markers =
    ai_generated: marks tests as generated by AI assistants (for filtering/identification)
filterwarnings =
    error
    # <https://github.com/enthought/traits/issues/1739>
    ignore:module 'sre_.*' is deprecated:DeprecationWarning:traits
    # pytest generates a number of inscrutable warnings about open files never
    # being closed.  I (jwodder) expect these are due to DataLad not shutting
    # down batch processes prior to garbage collection.
    ignore::pytest.PytestUnraisableExceptionWarning
    # I don't understand why this warning occurs, as we're using six 1.16,
    # which has the named method.
    ignore:_SixMetaPathImporter.find_spec\(\) not found:ImportWarning
    # <https://github.com/sensein/etelemetry-client/pull/44>
    ignore:.*pkg_resources:DeprecationWarning
    # <https://github.com/nipy/nipype/issues/3563>
    ignore:.*Use setlocale.* instead:DeprecationWarning:nipype
    # <https://github.com/nipy/nipype/pull/3670>
    ignore:.*datetime.datetime.utcnow\(\) is deprecated.*:DeprecationWarning:nipype

[coverage:run]
include = heudiconv/*
          setup.py

[flake8]
doctests = True
exclude = .*/,build/,dist/,test/data,venv/
hang-closing = False
unused-arguments-ignore-stub-functions = True
select = A,B,B902,C,E,E242,F,U100,W
ignore = A003,A005,B005,E203,E262,E266,E501,E704,W503

[isort]
atomic = True
force_sort_within_sections = True
honor_noqa = True
lines_between_sections = 1
profile = black
reverse_relative = True
sort_relative_in_force_sorted_sections = True
known_first_party = heudiconv
