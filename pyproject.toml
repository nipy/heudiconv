[build-system]
requires = [
    # 77.0.3 is the first version fully supporting PEP 639 (SPDX license
    # expressions and license-files) which we use below
    "setuptools >= 77.0.3",
    "versioningit ~= 2.3",
]
build-backend = "setuptools.build_meta"

[project]
name = "heudiconv"
description = "Heuristic DICOM Converter"
# README.rst, with its relative links absolutized -- see setup.py
authors = [
    { name = "HeuDiConv team and contributors" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.10"
# The lower bounds here and in the optional-dependencies below, besides "docs",
# are tested by "tox -e py3-lowest" (also on CI), which installs the lowest
# versions satisfying them on the oldest Python we support.  They are the
# oldest ones we know to work there, and not necessarily the oldest which
# could work.
dependencies = [
    # not usable in some use cases since might be just a downloader, not binary
    # "dcm2niix",
    # 0.8 does not work with nibabel 5
    "dcmstack>=0.9.0",
    # what nipype (see below) requires anyways
    "etelemetry>=0.3.1",
    "filelock>=3.0.12",
    # 5.5.0 added FilterMultiOrient to the default frame filters of the
    # multiframe DICOM wrapper: it warns, and changes the shape (hence seqinfo
    # dim3) reported for multi-orientation stacks such as scouts.
    # TODO: lift the ceiling once we decided how to handle that
    "nibabel>=5.3.1,<5.5",
    # 1.9.0 does not work with traits 7, which it allows.  1.8.6 works (it
    # requires older traits), but issues a warning on an invalid escape
    # sequence, which our tests treat as an error.
    "nipype >=1.9.1",
    # we use pydicom.tag.TagType, which older ones do not have
    "pydicom >= 2.2.0",
]
dynamic = ["version", "readme"]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
    "tinydb>=4.0.0",
    "inotify>=0.2.9",
]
extras = [
    # optional dependency.  Older ones fail to import with the due.py stub
    # of nipype
    "duecredit>=0.10.0",
]
# Keep the version in sync with MIN_DATALAD_VERSION in heudiconv/info.py
# <0.18 need pkg_resources, and with 0.18.0 and 0.18.1 test_prepare_for_datalad
# fails with the current git-annex
datalad = ["datalad >=0.18.2"]
# What it takes to build docs/ -- used by .readthedocs.yaml and "tox -e docs"
docs = [
    "sphinx",
    "sphinx-argparse",
]
all = ["heudiconv[tests,extras,datalad]"]

[project.scripts]
heudiconv = "heudiconv.cli.run:main"
heudiconv_monitor = "heudiconv.cli.monitor:main"

[project.urls]
Homepage = "https://github.com/nipy/heudiconv"
Documentation = "https://heudiconv.readthedocs.io"
"Source Code" = "https://github.com/nipy/heudiconv"
"Bug Tracker" = "https://github.com/nipy/heudiconv/issues"
Changelog = "https://github.com/nipy/heudiconv/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["heudiconv*"]

[tool.setuptools.package-data]
heudiconv = ["py.typed"]
"heudiconv.tests" = [
    "data/*.dcm",
    "data/*/*.dcm",
    "data/*/*/*.dcm",
    "data/sample_nifti*",
]

[tool.versioningit.write]
file = "heudiconv/_version.py"
