name: Build Docker image

on:
  push:
    branches:
      - master
  # Only build (never push) for the PRs which change what the image is made of
  # or how
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - pyproject.toml
      - utils/gen-docker-image.sh

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Generate Dockerfile
        run: bash gen-docker-image.sh
        working-directory: utils

      - name: Build Docker image
        run: |
          # build only if not release tag, i.e. has some "-" in describe
          # so we do not duplicate work with release workflow.
          git describe --match 'v[0-9]*' | grep -q -e - && \
              docker build \
                --label org.opencontainers.image.version="$(git describe --match 'v[0-9]*' | sed -e 's,^v,,g')" \
                --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
                --label org.opencontainers.image.source=https://github.com/nipy/heudiconv \
                -t nipy/heudiconv:master \
                -t nipy/heudiconv:unstable \
                .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          git describe --match 'v[0-9]*' | grep -q -e - && (
              docker login -u "$DOCKER_LOGIN" --password-stdin <<<"$DOCKER_TOKEN"
              docker push nipy/heudiconv:master
              docker push nipy/heudiconv:unstable
          )
        env:
          DOCKER_LOGIN: ${{ secrets.DOCKER_LOGIN }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

